name: Morning AI Market Outlook

on:
  # Scheduled emails merged into trading-bot daily email (email_alert.py + litellm).
  # Crons disabled — keep workflow_dispatch for manual testing of Render endpoint.
  # schedule:
  #   - cron: '50 12 * * 1-5'   # 8:00 AM ET (EST)
  #   - cron: '50 11 * * 1-5'   # 8:00 AM ET (EDT)
  workflow_dispatch:

jobs:
  send-outlook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pytz requests

      - name: Send morning email
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python morning_email.py
